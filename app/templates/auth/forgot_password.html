{% extends 'base.html' %}

{% block title %}Forgot Password - Talentryx Builder{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-lg mt-5">
            <div class="card-header bg-warning text-white text-center py-4">
                <h3 class="font-weight-light my-1">Reset Password</h3>
            </div>
            <div class="card-body p-5">
                {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div class="alert alert-danger" role="alert">
                    {{ messages[0] }}
                </div>
                {% endif %}
                {% endwith %}
                <form method="post">
                    <div class="form-floating mb-3">
                        <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com"
                            required />
                        <label for="email">Email address</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="new_password" name="new_password" type="password" placeholder="New Password"
                            required />
                        <label for="new_password">New Password</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="confirm_password" name="confirm_password" type="password" placeholder="Confirm Password"
                            required />
                        <label for="confirm_password">Confirm Password</label>
                    </div>
                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                        <a class="small" href="{{ url_for('auth.login') }}">Return to login</a>
                        <button class="btn btn-warning px-4" style="color: white;" type="submit">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
