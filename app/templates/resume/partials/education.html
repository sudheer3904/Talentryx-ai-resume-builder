{% if sections.education %}
<div class="section">
    <h2 class="section-title">{{ t.headers.education }}</h2>
    {% for edu in sections.education %}
    <div class="item">
        <div class="item-header clearfix">
            <span class="title">{{ edu.institution }}</span>
            <span class="date">{{ edu.year }}</span>
        </div>
        <div class="item-sub">{{ edu.degree }} {% if edu.score %}- {{ edu.score }}{% endif %}</div>
    </div>
    {% endfor %}
</div>
{% endif %}
