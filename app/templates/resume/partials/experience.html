{% if sections.experience %}
<div class="section">
    <h2 class="section-title">{{ t.headers.experience }}</h2>
    {% for exp in sections.experience %}
    <div class="item">
        <div class="item-header clearfix">
            <span class="title">{{ exp.company }}</span>
            <span class="date">{{ exp.start }} - {{ exp.end }}</span>
        </div>
        {% if exp.role %}<div class="item-sub">{{ exp.role }}</div>{% endif %}
        {% if exp.description %}
        <div class="item-desc">
            <span class="claim-text">{{ exp.description | safe }}</span>
        </div>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endif %}
