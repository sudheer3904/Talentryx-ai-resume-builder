{% extends 'base.html' %}

{% block title %}Admin Login - Talentryx{% endblock %}

{% block extra_css %}
<style>
    body {
        background-color: #f8fafc;
    }

    .admin-login-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        background: #ffffff;
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-header h2 {
        color: #0f172a;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .login-header p {
        color: #64748b;
        font-size: 0.95rem;
    }

    .form-control {
        border-radius: 8px;
        padding: 12px 16px;
        border: 1px solid #e2e8f0;
        margin-bottom: 20px;
    }

    .form-control:focus {
        border-color: #4a6fdc;
        box-shadow: 0 0 0 3px rgba(74, 111, 220, 0.2);
    }

    .btn-login {
        background-color: #4a6fdc;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        width: 100%;
        font-weight: 600;
        font-size: 1rem;
        transition: background-color 0.2s;
    }

    .btn-login:hover {
        background-color: #3b5bcb;
    }

    .icon-input {
        position: relative;
    }

    .icon-input i {
        position: absolute;
        top: 15px;
        left: 16px;
        color: #94a3b8;
    }

    .icon-input input {
        padding-left: 45px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container admin-login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Admin Panel</h2>
            <p>Sign in to access the dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('admin.login') }}">
            <div class="icon-input">
                <i class="fas fa-user"></i>
                <input type="text" name="username" class="form-control" placeholder="Admin Username" required autofocus>
            </div>

            <div class="icon-input">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-login mt-2">
                Sign In
            </button>

            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-muted small">
                    <i class="fas fa-arrow-left me-1"></i> Back to User Login
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
