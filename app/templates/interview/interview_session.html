{% extends 'base.html' %}

{% block title %}Mock Interview - {{ role }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-8">
        <div class="card shadow-lg">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-0">Mock Interview</h5>
                    <small>{{ role }}</small>
                </div>
                <button class="btn btn-sm btn-outline-light" id="btn-exit">
                    <i class="fas fa-times me-1"></i> Exit
                </button>
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span id="question-counter" class="small text-muted">Question 1 of {{ total_questions }}</span>
                    <span id="question-score" class="badge bg-secondary d-none"></span>
                </div>
                <div class="progress mb-3" style="height: 6px;">
                    <div id="question-progress" class="progress-bar bg-primary" role="progressbar" style="width: 0%;"
                        aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>

                <div class="mb-3">
                    <h6 id="question-text">Loading first question...</h6>
                </div>
                <div class="mb-3">
                    <label for="answer-input" class="form-label small text-muted">Your answer</label>
                    <textarea id="answer-input" class="form-control" rows="6"
                        placeholder="Type your answer here..."></textarea>
                </div>
                <div id="feedback-box" class="alert alert-info py-2 px-3 small d-none"></div>
            </div>
            <div class="card-footer bg-light d-flex justify-content-between">
                <button class="btn btn-outline-secondary" id="btn-prev" disabled>
                    <i class="fas fa-arrow-left me-1"></i> Previous
                </button>
                <div>
                    <button class="btn btn-outline-primary me-2" id="btn-next">
                        Next <i class="fas fa-arrow-right ms-1"></i>
                    </button>
                    <button class="btn btn-success" id="btn-submit">
                        <i class="fas fa-check me-1"></i> Submit Interview
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.INTERVIEW_CONFIG = {
        totalQuestions: {{ total_questions }},
        role: "{{ role|e }}",
        nextUrl: "{{ url_for('interview.next_question') }}",
        submitUrl: "{{ url_for('interview.submit_answer') }}",
        finishUrl: "{{ url_for('interview.finish') }}",
        resultUrl: "{{ url_for('interview.result') }}",
        dashboardUrl: "{{ url_for('resume.dashboard') }}"
    };
</script>
<script src="{{ url_for('static', filename='js/interview.js') }}"></script>
{% endblock %}
